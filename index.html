
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RashAI</title>

<style>
:root{
  --bg:#faf9f7;--panel:#f1efeb;--text:#1f1e1c;
  --muted:#7a766f;--line:#e2dfd9;--accent:#6d4aff;
  --accent-t:#fff;--user:#ece9ff;--code:#1e1e24;
  --code-t:#e8e6f0;color-scheme:light;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171618;--panel:#201f22;--text:#ececea;
    --muted:#95918a;--line:#33313a;--accent:#8b6dff;
    --user:#2a2542;--code:#0f0f13;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171618;--panel:#201f22;--text:#ececea;
  --muted:#95918a;--line:#33313a;--accent:#8b6dff;
  --user:#2a2542;--code:#0f0f13;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--text);
  font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
#side{
  width:260px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:12px;gap:8px;flex-shrink:0;
}
.brand{font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px;padding:4px 6px 10px}
.logo{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),#ff6ba8);
  color:#fff;display:grid;place-items:center;font-size:15px;
}
#new{
  background:var(--accent);color:var(--accent-t);border:0;
  border-radius:10px;padding:10px;font-weight:600;
}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.item{
  display:flex;align-items:center;gap:6px;padding:8px 10px;
  border-radius:8px;cursor:pointer;font-size:14px;
}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item:hover,.item.on{background:var(--line)}
.item button{background:none;border:0;color:var(--muted);padding:0 4px;opacity:0}
.item:hover button{opacity:1}
#theme{
  background:none;border:1px solid var(--line);border-radius:8px;
  padding:6px;color:var(--muted);font-size:13px;
}
main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
header{
  display:none;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--line);
}
#menu{background:none;border:0;font-size:22px}
#msgs{flex:1;overflow-y:auto;padding:20px 16px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.m{display:flex;gap:10px}
.m.u{justify-content:flex-end}
.bub{max-width:100%;min-width:0;overflow-wrap:anywhere}
.u .bub{
  background:var(--user);padding:10px 14px;
  border-radius:16px 16px 4px 16px;max-width:85%;white-space:pre-wrap;
}
.a .logo{margin-top:2px;flex-shrink:0}
.a .bub{flex:1;min-width:0}
.bub p{margin:0 0 10px}
.bub p:last-child{margin-bottom:0}
.bub ul,.bub ol{margin:0 0 12px;padding-left:24px}
.bub li{padding-left:2px;margin:3px 0}
.bub h1,.bub h2,.bub h3{margin:16px 0 7px;line-height:1.3}
.bub h1{font-size:1.3em}
.bub h2{font-size:1.15em}
.bub h3{font-size:1.05em}
.bub strong{font-weight:700}
.bub code{
  background:var(--panel);padding:2px 5px;border-radius:5px;
  font:0.9em ui-monospace,SFMono-Regular,Consolas,monospace;
}
.bub pre{
  background:var(--code);color:var(--code-t);padding:12px 14px;
  border-radius:10px;overflow-x:auto;margin:0 0 12px;
  font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;
  white-space:pre;
}
.bub pre code{background:none;padding:0;color:inherit;font:inherit}
.code-wrap{min-width:0;margin:0 0 12px}
.code-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:7px 12px;background:#292832;color:#d6d3e0;
  border-radius:10px 10px 0 0;font-size:12px;
}
.code-head button{
  background:transparent;border:1px solid #55515f;border-radius:6px;
  color:inherit;padding:3px 9px;font-size:12px;flex-shrink:0;
}
.code-head button:hover{background:#403d4a}
.code-wrap pre{margin:0;border-radius:0 0 10px 10px}
.bub table{
  width:100%;border-collapse:collapse;margin:10px 0 14px;
  font-size:14px;display:block;overflow-x:auto;
}
.bub th,.bub td{
  border:1px solid var(--line);padding:8px 10px;text-align:left;
  min-width:90px;
}
.bub th{background:var(--panel);font-weight:650}
.bub hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.err{color:#d6455d}
.hello{text-align:center;margin:12vh auto 0;max-width:560px}
.hello h1{font-size:34px;margin:10px 0 6px}
.hello p{color:var(--muted);margin:0 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{
  background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px;font-size:14px;
}
.chips button:hover{border-color:var(--accent)}
#bar{padding:10px 16px 14px}
#box{
  max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;
  background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:8px 8px 8px 14px;
}
#box:focus-within{border-color:var(--accent)}
textarea{
  flex:1;background:none;border:0;outline:0;resize:none;
  font:inherit;color:inherit;max-height:180px;padding:6px 0;
  min-width:0;
}
#send{
  background:var(--accent);color:var(--accent-t);border:0;
  border-radius:12px;width:38px;height:38px;font-size:18px;flex-shrink:0;
}
#send:disabled{opacity:.4;cursor:default}
.note{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}

@media(max-width:720px){
  #side{
    position:fixed;inset:0 auto 0 0;z-index:5;
    transform:translateX(-100%);transition:transform .2s;
    padding-top:calc(12px + env(safe-area-inset-top,0px));
  }
  #side.open{transform:none}
  header{display:flex}
  #msgs{padding:16px 12px}
  #bar{padding:8px 10px 12px}
  .hello{margin-top:8vh;padding:0 8px}
  .hello h1{font-size:28px}
  .u .bub{max-width:92%}
}
</style>
</head>

<body>
<aside id="side">
  <div class="brand"><div class="logo">✦</div>RashAI</div>
  <button id="new">+ New chat</button>
  <div id="list"></div>
  <button id="theme">Toggle theme</button>
</aside>

<main>
  <header>
    <button id="menu" aria-label="Menu">☰</button>
    <div class="brand" style="padding:0">
      <div class="logo">✦</div>RashAI
    </div>
  </header>

  <div id="msgs">
    <div class="wrap" id="wrap"></div>
  </div>

  <div id="bar">
    <div id="box">
      <textarea id="in" rows="1" placeholder="Message RashAI…"></textarea>
      <button id="send" aria-label="Send">↑</button>
    </div>
    <div class="note">
      RashAI is an AI and can make mistakes. Chats stay in your browser.
      <a href="/privacy" style="color:inherit">Privacy</a>
    </div>
  </div>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

let chats = [], cur = null, busy = false, ctrl = null;

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem("rashai") || "[]");
    chats = Array.isArray(saved) ? saved.filter(c =>
      c && typeof c.title === "string" && Array.isArray(c.msgs)
    ) : [];
  } catch {
    chats = [];
  }
}

function save() {
  try {
    localStorage.setItem("rashai", JSON.stringify(chats.slice(0, 40)));
  } catch {}
}

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function inline(text) {
  let result = esc(text);

  result = result.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  result = result.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  result = result.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  result = result.replace(/(^|[\s(])_([^_\n]+)_/g, "$1<em>$2</em>");

  return result;
}

function md(src) {
  const lines = String(src).replace(/\r\n?/g, "\n").split("\n");
  let out = "";
  let i = 0;

  function isTableRow(line) {
    return /^\s*\|.*\|\s*$/.test(line);
  }

  function cells(line) {
    return line.trim()
      .replace(/^\|/, "")
      .replace(/\|$/, "")
      .split("|")
      .map(cell => cell.trim());
  }

  function isTableSeparator(line) {
    if (!line.includes("-")) return false;
    return cells(line).every(cell => /^:?-{3,}:?$/.test(cell));
  }

  while (i < lines.length) {
    const line = lines[i];

    // Fenced code blocks
    if (/^\s*```/.test(line)) {
      const language = line.trim().slice(3).trim() || "Code";
      const code = [];
      i++;

      while (i < lines.length && !/^\s*```/.test(lines[i])) {
        code.push(lines[i]);
        i++;
      }

      if (i < lines.length) i++;

      out += '<div class="code-wrap">' +
        '<div class="code-head"><span>' + esc(language) +
        '</span><button type="button" data-copy>Copy code</button></div>' +
        '<pre><code>' + esc(code.join("\n")) +
        '</code></pre></div>';

      continue;
    }

    // Horizontal rules
    if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) {
      out += "<hr>";
      i++;
      continue;
    }

    // Markdown tables
    if (
      isTableRow(line) &&
      i + 1 < lines.length &&
      isTableRow(lines[i + 1]) &&
      isTableSeparator(lines[i + 1])
    ) {
      const headers = cells(line);
      const separator = cells(lines[i + 1]);
      const columnCount = Math.min(headers.length, separator.length);

      out += "<table><thead><tr>";

      for (let j = 0; j < columnCount; j++) {
        out += "<th>" + inline(headers[j]) + "</th>";
      }

      out += "</tr></thead><tbody>";
      i += 2;

      while (i < lines.length && isTableRow(lines[i])) {
        const row = cells(lines[i]);

        out += "<tr>";

        for (let j = 0; j < columnCount; j++) {
          out += "<td>" + inline(row[j] || "") + "</td>";
        }

        out += "</tr>";
        i++;
      }

      out += "</tbody></table>";
      continue;
    }

    // Headings
    const heading = line.match(/^(#{1,3})\s+(.*)$/);

    if (heading) {
      const level = heading[1].length;
      out += "<h" + level + ">" + inline(heading[2]) +
        "</h" + level + ">";
      i++;
      continue;
    }

    // Unordered lists
    if (/^\s*[-*]\s+/.test(line)) {
      out += "<ul>";

      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        const item = lines[i].replace(/^\s*[-*]\s+/, "");
        out += "<li>" + inline(item) + "</li>";
        i++;
      }

      out += "</ul>";
      continue;
    }

    // Ordered lists: supports both 1. and 1)
    if (/^\s*\d+[.)]\s+/.test(line)) {
      out += "<ol>";

      while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) {
        const item = lines[i].replace(/^\s*\d+[.)]\s+/, "");
        out += "<li>" + inline(item) + "</li>";
        i++;
      }

      out += "</ol>";
      continue;
    }

    // Blank lines
    if (!line.trim()) {
      i++;
      continue;
    }

    // Normal paragraphs
    out += "<p>" + inline(line) + "</p>";
    i++;
  }

  return out;
}

function renderList() {
  const list = $("list");
  list.innerHTML = "";

  chats.forEach(chat => {
    const item = document.createElement("div");
    item.className = "item" + (chat === cur ? " on" : "");

    const title = document.createElement("span");
    title.textContent = chat.title;

    const remove = document.createElement("button");
    remove.textContent = "✕";
    remove.title = "Delete chat";
    remove.setAttribute("aria-label", "Delete chat");

    remove.onclick = event => {
      event.stopPropagation();

      if (busy && chat === cur) return;

      chats = chats.filter(c => c !== chat);

      if (cur === chat) cur = null;

      save();
      renderList();
      renderChat();
    };

    item.onclick = () => {
      if (busy) return;

      cur = chat;
      renderList();
      renderChat();
      $("side").classList.remove("open");
    };

    item.append(title, remove);
    list.append(item);
  });
}

function bubble(role, html) {
  const message = document.createElement("div");
  message.className = "m " + (role === "user" ? "u" : "a");

  if (role !== "user") {
    const logo = document.createElement("div");
    logo.className = "logo";
    logo.textContent = "✦";
    message.append(logo);
  }

  const content = document.createElement("div");
  content.className = "bub";
  content.innerHTML = html;

  message.append(content);
  $("wrap").append(message);

  return content;
}

function renderChat() {
  const wrap = $("wrap");
  wrap.innerHTML = "";

  if (!cur || !cur.msgs.length) {
    wrap.innerHTML =
      '<div class="hello">' +
        '<div class="logo" style="width:52px;height:52px;font-size:26px;margin:0 auto;border-radius:14px">✦</div>' +
        '<h1>Hi, I’m RashAI</h1>' +
        '<p>Ask me anything: code, ideas, writing, study help.</p>' +
        '<div class="chips"></div>' +
      '</div>';

    [
      "Explain pointers in C",
      "Write a Python quiz game",
      "Give me a study plan",
      "Tell me a fun fact"
    ].forEach(text => {
      const button = document.createElement("button");
      button.textContent = text;
      button.onclick = () => send(text);
      wrap.querySelector(".chips").append(button);
    });

    return;
  }

  cur.msgs.forEach(message => {
    bubble(
      message.role,
      message.role === "user" ? esc(message.content) : md(message.content)
    );
  });

  $("msgs").scrollTop = $("msgs").scrollHeight;
}

async function send(text) {
  text = (text || $("in").value).trim();

  if (!text || busy) return;

  if (!cur) {
    cur = { title: text.slice(0, 32), msgs: [] };
    chats.unshift(cur);
  }

  cur.msgs.push({ role: "user", content: text });

  $("in").value = "";
  grow();
  renderChat();
  renderList();

  const answerBubble = bubble("assistant", "<p>Thinking…</p>");
  $("msgs").scrollTop = $("msgs").scrollHeight;

  busy = true;
  $("send").disabled = true;
  ctrl = new AbortController();

  const activeChat = cur;
  const history = activeChat.msgs.map(message => ({
    role: message.role,
    content: message.content
  }));

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
      signal: ctrl.signal
    });

    const result = await response.json();

    if (!response.ok) {
      const error = new Error(
        result.error || "The request could not be completed."
      );
      error.status = response.status;
      throw error;
    }

    if (typeof result.text !== "string") {
      throw new Error("The server returned an invalid answer.");
    }

    activeChat.msgs.push({
      role: "assistant",
      content: result.text
    });

    answerBubble.innerHTML = md(result.text);

  } catch (error) {
    const message = error.name === "AbortError"
      ? "Request cancelled."
      : error.status === 429
        ? "Too many requests. Please wait a minute and try again."
        : error.message || "Something went wrong. Please try again.";

    answerBubble.innerHTML =
      '<p class="err">' + esc(message) + '</p>';

    // Keep the user's question, but don't save the temporary error
    // as an assistant answer.
  } finally {
    busy = false;
    ctrl = null;
    $("send").disabled = false;

    save();
    renderList();
    $("msgs").scrollTop = $("msgs").scrollHeight;
    $("in").focus();
  }
}

function grow() {
  const textarea = $("in");
  textarea.style.height = "auto";
  textarea.style.height = Math.min(textarea.scrollHeight, 180) + "px";
}

$("in").addEventListener("input", grow);

$("in").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    send();
  }
});

$("send").onclick = () => send();

$("new").onclick = () => {
  if (busy) return;

  cur = null;
  renderList();
  renderChat();
  $("side").classList.remove("open");
  $("in").focus();
};

$("menu").onclick = () => {
  $("side").classList.toggle("open");
};

$("theme").onclick = () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).colorScheme === "dark";

  root.setAttribute("data-theme", dark ? "light" : "dark");
};

// Event delegation makes Copy work for current and newly generated code blocks.
$("wrap").addEventListener("click", async event => {
  const button = event.target.closest("[data-copy]");
  if (!button) return;

  const codeBlock = button.closest(".code-wrap");
  const code = codeBlock && codeBlock.querySelector("code");

  if (!code) return;

  try {
    await navigator.clipboard.writeText(code.textContent);
    button.textContent = "Copied!";
    button.disabled = true;

    setTimeout(() => {
      button.textContent = "Copy code";
      button.disabled = false;
    }, 1500);

  } catch {
    button.textContent = "Copy failed";

    setTimeout(() => {
      button.textContent = "Copy code";
    }, 1500);
  }
});

load();
renderList();
renderChat();
</script>
</body>
</html>
