<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RashAI</title>
<style>
:root{--bg:#111827;--panel:#182235;--panel2:#222f45;--text:#edf2fb;--muted:#a5b1c5;--line:#334155;--accent:#a5b4fc;--accentText:#111827;--user:#202d42;--shadow:0 12px 36px #0003}
body.light{--bg:#f4f6fb;--panel:#fff;--panel2:#e9edf7;--text:#202a3b;--muted:#69758a;--line:#d9dfeb;--accent:#5865c8;--accentText:#fff;--user:#e8edf8;--shadow:0 12px 36px #202a3b12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif;height:100dvh;overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 15% 8%,#6478b51c,transparent 42%),radial-gradient(ellipse at 88% 88%,#8b9ed31a,transparent 40%);z-index:-1}
button,textarea,select{font:inherit}button{cursor:pointer;color:inherit}
#overlay{position:fixed;inset:0;background:#0007;opacity:0;visibility:hidden;transition:.2s;z-index:8}#overlay.show{opacity:1;visibility:visible}
#side{position:fixed;z-index:10;inset:0 auto 0 0;width:275px;background:var(--panel);border-right:1px solid var(--line);padding:16px 13px;display:flex;flex-direction:column;gap:15px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}#side.open{transform:translateX(0)}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:19px;padding:3px 6px}.logo{width:33px;height:33px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#c7d2fe,#818cf8);color:#111827;font-weight:900}
.iconbtn{border:1px solid var(--line);background:var(--panel2);border-radius:11px;width:36px;height:36px;display:grid;place-items:center;flex-shrink:0}.iconbtn:hover{filter:brightness(1.1)}
.newchat{display:flex;align-items:center;gap:9px;width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);text-align:left}
.sectionlabel{font-size:11px;color:var(--muted);padding:0 8px;text-transform:uppercase;letter-spacing:.08em}
#recent{display:flex;flex-direction:column;gap:4px;overflow:auto}.recentitem{border:0;background:transparent;text-align:left;border-radius:9px;padding:8px 9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}.recentitem:hover{background:var(--panel2);color:var(--text)}
.sidebottom{margin-top:auto;display:grid;gap:5px}.sideaction{display:flex;align-items:center;gap:10px;background:transparent;border:0;border-radius:9px;padding:9px;text-align:left}.sideaction:hover{background:var(--panel2)}
main{height:100dvh;display:flex;flex-direction:column;position:relative}
header{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);flex-shrink:0}.headbrand{font-size:16px;font-weight:750}.header-spacer{flex:1}
#msgs{flex:1;overflow:auto;padding:22px 18px 15px;scroll-behavior:smooth}.hello{max-width:650px;margin:10vh auto 0;text-align:center}.hello h1{font-size:clamp(26px,4vw,36px);letter-spacing:-.04em;margin:0 0 8px}.hello p{color:var(--muted);margin:0}
#wrap{width:min(780px,calc(100% - 20px));margin:0 auto}.msgrow{display:flex;margin:0 auto 20px;max-width:780px;gap:10px;align-items:flex-start}.msgrow.user{justify-content:flex-end}.bubble{max-width:min(100%,680px);padding:11px 14px;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:var(--user);border:1px solid var(--line);border-bottom-right-radius:5px}.assistant .bubble{padding:2px 0;max-width:100%;width:100%}.msgactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.smallbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 8px;font-size:12px;color:var(--muted)}.smallbtn:hover{color:var(--text);background:var(--panel2)}
pre{background:#08120f;color:#d8f0df;padding:12px;border-radius:11px;overflow:auto;white-space:pre}
#bar{width:min(760px,calc(100% - 28px));margin:0 auto 10px;padding:7px 9px;border:1px solid var(--line);border-radius:19px;background:var(--panel);box-shadow:var(--shadow);position:relative;z-index:2}
#prompt{width:100%;min-height:34px;max-height:140px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:6px 7px}
.toolbar{display:flex;align-items:center;gap:7px;padding:1px 0 0}.toolbar .spacer{flex:1}
.modebtn{height:34px;width:36px;border:1px solid var(--line);background:var(--panel2);border-radius:11px;display:grid;place-items:center;color:var(--accent);transition:.18s}.modebtn svg{width:18px;height:18px}.modebtn:hover{background:var(--accent);color:var(--accentText);transform:translateY(-1px)}
.sendbtn{background:var(--accent);color:var(--accentText);border:0;border-radius:11px;width:35px;height:35px;display:grid;place-items:center;font-size:19px;font-weight:800}.sendbtn:disabled{opacity:.45;cursor:not-allowed}
#modeMenu{position:absolute;left:9px;bottom:calc(100% + 8px);display:none;width:175px;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);z-index:5}#modeMenu.show{display:grid}
.modeoption{border:0;background:transparent;text-align:left;border-radius:8px;padding:9px;display:flex;align-items:center;gap:9px;color:var(--text)}.modeoption:hover,.modeoption.active{background:var(--panel2)}.check{margin-left:auto;color:var(--accent)}
#file{display:none}.filechip{font-size:11px;color:var(--muted);padding:0 7px;display:none;cursor:pointer}.hint{text-align:center;color:var(--muted);font-size:10px;padding:0 8px 7px}
.typing{color:var(--muted);font-size:13px;padding:8px 0}
body.empty #msgs{display:flex;align-items:center;justify-content:center;padding-bottom:125px;overflow:hidden}body.empty .hello{margin:0 auto;transform:translateY(-26px)}body.empty #wrap{display:none}body.empty #bar{position:absolute;top:59%;left:50%;transform:translate(-50%,-50%);margin:0}
@media(max-width:600px){header{height:52px;padding:0 10px}#msgs{padding:16px 12px}.hello{margin-top:8vh;padding:0 8px}.hello h1{font-size:27px}#bar{width:calc(100% - 18px);margin-bottom:8px}.msgrow{gap:7px}.bubble{padding:10px 12px}body.empty #bar{top:59%}}
@media(max-height:620px){body.empty #bar{top:65%}body.empty .hello{transform:translateY(-45px)}}
</style>
</head>
<body class="empty">
<div id="overlay"></div>
<aside id="side">
 <div class="brand"><div class="logo">R</div><span>RashAI</span><div style="flex:1"></div><button class="iconbtn" id="closeSide" aria-label="Close sidebar" title="Close sidebar">×</button></div>
 <button class="newchat" id="newChat"><span>＋</span> New chat</button>
 <div class="sectionlabel">Recent chats</div><div id="recent"></div>
 <div class="sidebottom"><button class="sideaction" id="themeBtn"><span>☼</span> Toggle theme</button><button class="sideaction" id="clearChats">⌫ Clear chat history</button></div>
</aside>
<main>
 <header><button class="iconbtn" id="menu" aria-label="Open sidebar" title="Open sidebar"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="headbrand">RashAI</div><div class="header-spacer"></div></header>
 <section id="msgs"><div class="hello" id="hello"><h1>What’s on your mind?</h1><p>A calm space to think, learn, and create.</p></div><div id="wrap"></div></section>
 <div id="bar">
  <div class="filechip" id="filechip"></div>
  <textarea id="prompt" rows="1" placeholder="Message RashAI..." aria-label="Message RashAI"></textarea>
  <div class="toolbar">
   <button class="iconbtn" id="attach" title="Attach a file" aria-label="Attach a file">＋</button><input type="file" id="file" accept=".txt,.pdf,.png,.jpg,.jpeg,.webp,.md,.csv,.json">
   <button class="modebtn" id="modeBtn" title="Choose chat mode" aria-label="Choose chat mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><path d="M13 4v6M7 14v6"/></svg></button>
   <button class="iconbtn" id="mic" title="Voice input" aria-label="Voice input">🎙</button><div class="spacer"></div><button class="sendbtn" id="send" title="Send message" aria-label="Send message">↑</button>
  </div>
  <div id="modeMenu">
   <button class="modeoption active" data-mode="general"><span>💬</span> General <span class="check">✓</span></button>
   <button class="modeoption" data-mode="study"><span>📚</span> Study <span class="check"></span></button>
   <button class="modeoption" data-mode="coding"><span>💻</span> Coding <span class="check"></span></button>
   <button class="modeoption" data-mode="writing"><span>✍️</span> Writing <span class="check"></span></button>
  </div>
 </div>
 <div class="hint">RashAI can make mistakes. Check important information.</div>
</main>
<script>
const API_URL="https://rashai.onrender.com/api/chat", $=id=>document.getElementById(id);
let history=[],attachment=null,selectedMode="general",busy=false;
let savedChats=JSON.parse(localStorage.getItem("rashai")||"[]");
function openSidebar(){$("side").classList.add("open");$("overlay").classList.add("show")}
function closeSidebar(){$("side").classList.remove("open");$("overlay").classList.remove("show")}
$("menu").onclick=openSidebar;$("closeSide").onclick=closeSidebar;$("overlay").onclick=closeSidebar;
function persist(){localStorage.setItem("rashai",JSON.stringify(savedChats))}
function renderRecent(){$("recent").innerHTML="";savedChats.slice().reverse().forEach(chat=>{let b=document.createElement("button");b.className="recentitem";b.textContent=chat.title||"Chat";b.onclick=()=>{history=chat.messages||[];renderMessages();closeSidebar()};$("recent").appendChild(b)})}
function escapeHTML(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function formatAnswer(t){let s=escapeHTML(t);s=s.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>`<pre><code>${c.trim()}</code></pre>`);s=s.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");return s.replace(/\n/g,"<br>")}
function action(label,fn){let b=document.createElement("button");b.className="smallbtn";b.textContent=label;b.onclick=fn;return b}
function renderMessages(){
 const wrap=$("wrap");wrap.innerHTML="";document.body.classList.toggle("empty",history.length===0);$("hello").style.display=history.length?"none":"block";
 history.forEach(m=>{let row=document.createElement("div");row.className="msgrow "+(m.role==="user"?"user":"assistant");let bubble=document.createElement("div");bubble.className="bubble";if(m.role==="assistant")bubble.innerHTML=formatAnswer(m.content||"");else bubble.textContent=m.content||"";row.appendChild(bubble);
 if(m.role==="assistant"){let a=document.createElement("div");a.className="msgactions";a.append(action("Copy",()=>navigator.clipboard?.writeText(m.content||"")),action("Read aloud",()=>speak(m.content||"")),action("Download TXT",()=>downloadText(m.content||"","rashai-answer.txt")),action("Download PDF",()=>downloadPDF(m.content||"")));bubble.appendChild(a)}wrap.appendChild(row)});
 $("msgs").scrollTop=$("msgs").scrollHeight;
}
function saveCurrentChat(){if(!history.length)return;let title=(history.find(m=>m.role==="user")?.content||"New chat").slice(0,42);savedChats.push({title,messages:history,updated:Date.now()});savedChats=savedChats.slice(-30);persist();renderRecent()}
function newChat(){if(history.length)saveCurrentChat();history=[];attachment=null;updateFileChip();renderMessages();$("prompt").value="";closeSidebar();$("prompt").focus()}
$("newChat").onclick=newChat;$("clearChats").onclick=()=>{if(confirm("Clear all saved chat history?")){savedChats=[];persist();renderRecent()}};
$("themeBtn").onclick=()=>{document.body.classList.toggle("light");localStorage.setItem("rashai-theme",document.body.classList.contains("light")?"light":"dark")};if(localStorage.getItem("rashai-theme")==="light")document.body.classList.add("light");
function updateModeMenu(){document.querySelectorAll(".modeoption").forEach(b=>{let on=b.dataset.mode===selectedMode;b.classList.toggle("active",on);b.querySelector(".check").textContent=on?"✓":""})}
$("modeBtn").onclick=()=>$("modeMenu").classList.toggle("show");
document.querySelectorAll(".modeoption").forEach(b=>b.onclick=()=>{selectedMode=b.dataset.mode;updateModeMenu();$("modeMenu").classList.remove("show");$("modeBtn").title="Chat mode: "+selectedMode});
document.addEventListener("click",e=>{if(!$("modeMenu").contains(e.target)&&e.target!==$("modeBtn"))$("modeMenu").classList.remove("show")});
$("attach").onclick=()=>$("file").click();
$("file").onchange=async e=>{let f=e.target.files[0];if(!f)return;attachment={name:f.name,type:f.type||"application/octet-stream"};if(f.type.startsWith("text/")||/\.(txt|md|csv|json)$/i.test(f.name))attachment.content=await f.text();else if(f.type.startsWith("image/"))attachment.content=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});updateFileChip()};
function updateFileChip(){$("filechip").style.display=attachment?"block":"none";$("filechip").textContent=attachment?`Attached: ${attachment.name}  ×`:"";$("filechip").onclick=()=>{attachment=null;$("file").value="";updateFileChip()}}
async function send(){
 let text=$("prompt").value.trim();if((!text&&!attachment)||busy)return;let msg=text+(attachment?`\n[Attachment: ${attachment.name}]`:"");history.push({role:"user",content:msg});renderMessages();$("prompt").value="";$("prompt").style.height="34px";busy=true;$("send").disabled=true;
 let loading=document.createElement("div");loading.className="typing";loading.textContent="RashAI is thinking…";$("wrap").appendChild(loading);$("msgs").scrollTop=$("msgs").scrollHeight;
 try{let r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history,attachment,mode:selectedMode})});if(!r.ok)throw Error("Server returned "+r.status);let d=await r.json();history.push({
  role: "assistant",
  content: d.text || d.reply || d.response || d.message || d.answer || "I couldn't find a response. Please try again."
});renderMessages();saveCurrentChat()}
 catch(e){history.push({role:"assistant",content:"Sorry, I couldn't connect to RashAI right now. Please try again.\n\nDetails: "+e.message});renderMessages()}
 finally{attachment=null;$("file").value="";updateFileChip();busy=false;$("send").disabled=false;$("prompt").focus()}
}
$("send").onclick=send;$("prompt").addEventListener("input",()=>{$("prompt").style.height="34px";$("prompt").style.height=Math.min($("prompt").scrollHeight,140)+"px"});$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
function speak(t){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}
function downloadText(t,n){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download=n;a.click();URL.revokeObjectURL(a.href)}
function downloadPDF(t){let w=window.open("","_blank");if(!w){alert("Allow pop-ups to print or save as PDF.");return}w.document.write(`<html><head><title>RashAI Answer</title><style>body{font:14px Arial;white-space:pre-wrap;line-height:1.6;padding:30px;color:#111}</style></head><body>${escapeHTML(t)}</body></html>`);w.document.close();w.focus();w.print()}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

$("mic").onclick = () => {
  if (!SR) {
    alert("Voice input is not supported. Please use Google Chrome.");
    return;
  }

  const r = new SR();
  r.lang = "en-IN";
  r.interimResults = true;
  r.continuous = false;

  $("mic").textContent = "🔴";

  r.onresult = (e) => {
    let text = "";

    for (let i = 0; i < e.results.length; i++) {
      text += e.results[i][0].transcript;
    }

    $("prompt").value = text;
    $("prompt").dispatchEvent(new Event("input"));
  };

  r.onerror = (e) => {
    alert("Voice input error: " + e.error);
  };

  r.onend = () => {
    $("mic").textContent = "🎙";
  };

  try {
    r.start();
  } catch (e) {
    $("mic").textContent = "🎙";
    alert("Could not start voice input. Please try again.");
  }
};
renderRecent();renderMessages();updateModeMenu();
</script>
</body>
</html>
