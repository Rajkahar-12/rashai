<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RashAI — Study Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<!-- KaTeX styles (equations) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
:root{
  --bg:#070b14;
  --bg2:#0b1120;
  --panel:#0f172a;
  --panel2:#141f38;
  --panel3:#1c2a48;
  --text:#eef2fb;
  --muted:#8a97b3;
  --line:#1e2a44;
  --accent:#7c8cff;
  --accent2:#a78bfa;
  --accent3:#38bdf8;
  --accentText:#060912;
  --user:#16223c;
  --code:#c9e6d4;
  --shadow:0 22px 60px rgba(2,6,23,.55);
  --radius:18px;
  --ring:0 0 0 3px rgba(124,140,255,.18);
}
body.light{
  --bg:#f5f7fc;
  --bg2:#eef1f8;
  --panel:#ffffff;
  --panel2:#eef1f8;
  --panel3:#e3e9f5;
  --text:#151d2e;
  --muted:#66718a;
  --line:#dde4f0;
  --accent:#4f5fd6;
  --accent2:#7c63dd;
  --accent3:#0ea5e9;
  --accentText:#ffffff;
  --user:#e9eefb;
  --code:#1d3b2f;
  --shadow:0 18px 50px rgba(20,32,60,.10);
  --ring:0 0 0 3px rgba(79,95,214,.14);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:15px/1.62 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  height:100dvh;overflow:hidden;
  -webkit-font-smoothing:antialiased;
  width:100%;min-width:0;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-2;
  background:
    radial-gradient(900px 600px at 8% -10%, rgba(124,140,255,.22), transparent 62%),
    radial-gradient(700px 520px at 108% 8%, rgba(167,139,250,.16), transparent 60%),
    radial-gradient(1000px 700px at 50% 118%, rgba(56,189,248,.10), transparent 65%);
}
body:after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    linear-gradient(180deg, rgba(7,11,20,0) 0%, rgba(7,11,20,.55) 100%);
  opacity:.55;
}
body.light:after{background:linear-gradient(180deg, rgba(245,247,252,0) 0%, rgba(245,247,252,.6) 100%);opacity:.5}

button,textarea,select{font:inherit}
button{cursor:pointer;color:inherit;border:0;background:none}
button:disabled{cursor:not-allowed}
::selection{background:var(--accent);color:var(--accentText)}

*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

#overlay{position:fixed;inset:0;background:rgba(4,8,18,.55);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:.22s;z-index:8}
#overlay.show{opacity:1;visibility:visible}

/* ---------- sidebar ---------- */
#side{
  position:fixed;z-index:10;inset:0 auto 0 0;width:288px;
  background:linear-gradient(180deg,var(--panel) 0%, var(--bg2) 100%);
  border-right:1px solid var(--line);
  padding:18px 14px;display:flex;flex-direction:column;gap:14px;
  transform:translateX(-105%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  box-shadow:var(--shadow);
}
#side.open{transform:translateX(0)}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:17px;padding:4px 6px;letter-spacing:-.02em}
.logo{
  width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),var(--accent2));
  color:#080c16;font-weight:800;font-size:18px;
  box-shadow:0 8px 22px rgba(124,140,255,.45), inset 0 -2px 6px rgba(0,0,0,.2);
}
.iconbtn{
  border:1px solid var(--line);background:var(--panel2);border-radius:12px;
  width:38px;height:38px;display:grid;place-items:center;flex-shrink:0;
  transition:.18s;color:var(--muted);
}
.iconbtn:hover{background:var(--panel3);border-color:var(--accent);color:var(--text);transform:translateY(-1px)}
.newchat{
  display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;
  border:1px solid var(--line);border-radius:14px;
  background:linear-gradient(145deg, var(--panel2), var(--panel));
  text-align:left;font-weight:600;font-size:14px;transition:.18s;
  color:var(--text);
}
.newchat:hover{border-color:var(--accent);box-shadow:var(--ring);transform:translateY(-1px)}
.newchat span{font-size:18px;color:var(--accent);font-weight:700}
.sectionlabel{font-size:10.5px;color:var(--muted);padding:0 8px;text-transform:uppercase;letter-spacing:.12em;font-weight:600}
#recent{display:flex;flex-direction:column;gap:3px;overflow:auto;flex:1;min-height:0}
.recentitem{
  border:0;background:transparent;text-align:left;border-radius:10px;
  padding:10px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--muted);font-size:14px;transition:.14s;border-left:2px solid transparent;
}
.recentitem:hover{background:var(--panel2);color:var(--text)}
.recentitem.active{background:var(--panel2);color:var(--text);border-left-color:var(--accent)}
.sidebottom{margin-top:auto;display:grid;gap:3px;padding-top:10px;border-top:1px solid var(--line)}
.sideaction{display:flex;align-items:center;gap:10px;background:transparent;border:0;border-radius:10px;padding:10px 12px;text-align:left;color:var(--muted);font-size:14px;transition:.14s}
.sideaction:hover{background:var(--panel2);color:var(--text)}
.sideaction span{width:16px;text-align:center;color:var(--accent)}

/* ---------- main ---------- */
main{height:100dvh;display:flex;flex-direction:column;position:relative;min-width:0;min-height:0}
header{
  height:62px;display:flex;align-items:center;gap:12px;padding:0 18px;
  border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:blur(16px) saturate(1.25);flex-shrink:0;z-index:5;
}
.headbrand{font-size:16px;font-weight:700;letter-spacing:-.01em}
.headbrand b{color:var(--accent)}
.studybadge{
  font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 9px;border-radius:99px;color:var(--accent);
  background:color-mix(in srgb,var(--accent) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 34%,transparent);
}
.header-spacer{flex:1}
.statusdot{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:6px 11px;border:1px solid var(--line);border-radius:99px;background:var(--panel)}
.statusdot i{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 10px rgba(74,222,128,.6);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

#msgs{flex:1;overflow:auto;padding:28px 18px 16px;scroll-behavior:smooth;min-height:0;min-width:0}
.hello{max-width:680px;margin:10vh auto 0;text-align:center;padding:0 12px}
.hello .orb{
  width:84px;height:84px;margin:0 auto 24px;border-radius:26px;
  background:linear-gradient(145deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-size:38px;font-weight:800;color:#080c16;
  box-shadow:0 22px 50px rgba(124,140,255,.45), inset 0 -8px 18px rgba(0,0,0,.25);
  animation:float 6s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hello h1{font-family:Fraunces,Georgia,serif;font-size:clamp(28px,4.2vw,42px);letter-spacing:-.03em;margin:0 0 12px;font-weight:700;line-height:1.15}
.hello h1 span{background:linear-gradient(120deg,var(--accent),var(--accent2) 55%,var(--accent3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hello p{color:var(--muted);margin:0;font-size:15.5px;max-width:460px;margin-inline:auto}
.suggestions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:30px}
.suggestions button{
  border:1px solid var(--line);background:linear-gradient(145deg,var(--panel),var(--panel2));
  border-radius:99px;padding:9px 16px;font-size:13px;color:var(--muted);transition:.18s;
  font-weight:500;
}
.suggestions button:hover{border-color:var(--accent);color:var(--text);transform:translateY(-1px);box-shadow:var(--ring)}

#wrap{width:min(820px,calc(100% - 20px));margin:0 auto}
.msgrow{display:flex;margin:0 auto 24px;max-width:820px;gap:12px;align-items:flex-start;animation:rise .32s ease both;min-width:0}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msgrow.user{justify-content:flex-end}
.bubble{max-width:min(100%,720px);padding:13px 16px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;line-height:1.68;min-width:0}
.user .bubble{
  background:linear-gradient(145deg,var(--user),color-mix(in srgb,var(--user) 82%,var(--accent)));
  border:1px solid var(--line);border-bottom-right-radius:6px;
  box-shadow:0 4px 14px rgba(2,6,23,.25);
}
.assistant .bubble{
  padding:16px 18px;max-width:100%;width:100%;white-space:normal;
  background:linear-gradient(180deg,var(--panel) 0%, color-mix(in srgb,var(--panel) 82%,var(--bg)) 100%);
  border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px rgba(2,6,23,.28);
}
.msgactions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.smallbtn{
  border:1px solid var(--line);background:var(--panel2);border-radius:9px;
  padding:6px 11px;font-size:12px;color:var(--muted);transition:.14s;font-weight:500;
}
.smallbtn:hover:not(:disabled){color:var(--accent);border-color:var(--accent);background:var(--panel3);transform:translateY(-1px)}
.smallbtn:disabled{opacity:.6}
pre{
  background:var(--bg2);color:var(--code);padding:14px 16px;border-radius:12px;
  overflow:auto;white-space:pre;border:1px solid var(--line);font-size:13px;
  font-family:"SF Mono",Menlo,Consolas,monospace;line-height:1.58;max-width:100%;
}
code{background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:13px;font-family:"SF Mono",Menlo,Consolas,monospace;color:var(--accent2)}
pre code{background:none;padding:0;color:inherit}
.typing{color:var(--muted);font-size:13px;padding:10px 2px;display:flex;align-items:center;gap:9px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:bounce 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

/* ---------- composer ---------- */
#bar{
  width:min(820px,calc(100% - 28px));margin:0 auto 12px;padding:10px 12px;
  border:1px solid var(--line);border-radius:22px;
  background:linear-gradient(180deg,var(--panel), color-mix(in srgb,var(--panel) 88%,var(--bg)));
  box-shadow:var(--shadow);position:relative;z-index:2;
  transition:border-color .2s,box-shadow .2s;
}
#bar:focus-within{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));box-shadow:var(--shadow),var(--ring)}
.filechip{
  font-size:12px;color:var(--accent);padding:6px 10px;display:none;cursor:pointer;
  background:var(--panel2);border-radius:8px;margin-bottom:6px;width:fit-content;border:1px solid var(--line);
}
#prompt{
  width:100%;min-height:40px;max-height:160px;resize:none;border:0;outline:0;
  background:transparent;color:var(--text);padding:9px 8px;font-size:15px;line-height:1.55;
}
#prompt::placeholder{color:var(--muted)}
.toolbar{display:flex;align-items:center;gap:8px;padding:4px 0 0;flex-wrap:wrap}
.toolbar .spacer{flex:1}
#voiceLanguage{
  max-width:118px;height:38px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel2);color:var(--text);padding:0 8px;font-size:13px;outline:0;
}
#voiceLanguage:focus{border-color:var(--accent);box-shadow:var(--ring)}
#mic.recording{
  background:#ef4444;color:#fff;border-color:#ef4444;
  animation:recmic 1.2s infinite;
}
@keyframes recmic{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 7px rgba(239,68,68,0)}}
.sendbtn{
  background:linear-gradient(145deg,var(--accent),var(--accent2));color:var(--accentText);
  border:0;border-radius:13px;width:42px;height:42px;display:grid;place-items:center;
  font-size:20px;font-weight:800;transition:.16s;
  box-shadow:0 8px 22px rgba(124,140,255,.5);
}
.sendbtn:hover:not(:disabled){transform:translateY(-1px) scale(1.03);box-shadow:0 12px 28px rgba(124,140,255,.65)}
.sendbtn:disabled{opacity:.45;box-shadow:none}
.hint{text-align:center;color:var(--muted);font-size:11px;padding:0 8px 10px;opacity:.7}
#file{display:none}

/* empty state */
body.empty #msgs{display:flex;align-items:center;justify-content:center;padding-bottom:140px;overflow:hidden}
body.empty .hello{margin:0 auto;transform:translateY(-18px)}
body.empty #wrap{display:none}
body.empty #bar{position:absolute;top:62%;left:50%;transform:translate(-50%,-50%);margin:0}

@media(max-width:600px){
  header{height:56px;padding:0 12px;gap:9px}
  .studybadge{display:none}
  #msgs{padding:18px 12px}
  .hello{margin-top:8vh;padding:0 8px}
  .hello h1{font-size:clamp(24px,7vw,29px)}
  .hello .orb{width:68px;height:68px;font-size:30px;border-radius:22px}
  .hello p{font-size:14.5px}
  #bar{width:calc(100% - 18px);margin-bottom:9px;border-radius:20px}
  .msgrow{gap:8px;margin-bottom:18px}
  .bubble{padding:11px 13px;font-size:14px}
  .assistant .bubble{padding:14px 14px}
  body.empty #bar{top:64%}
  #voiceLanguage{max-width:88px}
  .toolbar .spacer{display:none}
}
@media(max-height:620px){body.empty #bar{top:68%}body.empty .hello{transform:translateY(-30px)}}

/* mobile fixes */
main{min-width:0;min-height:0}
#msgs{min-height:0;min-width:0}
#wrap,.msgrow,.bubble{min-width:0}
@media (max-width:600px){
  body{height:100dvh;overflow:hidden}
  main{height:100dvh;height:100%;min-height:0}
  #msgs{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain}
  body.empty #msgs{
    display:flex;flex-direction:column;align-items:stretch;
    justify-content:flex-start;padding:22px 10px 16px;overflow-y:auto;
  }
  body.empty .hello{margin:18px auto 22px;padding:0 4px;transform:none;width:100%}
  .suggestions{gap:8px;margin-top:22px}
  .suggestions button{max-width:100%}
  body.empty #bar{position:relative;top:auto;left:auto;transform:none;width:100%;margin:0 auto 8px;flex-shrink:0}
  #bar{width:calc(100% - 16px)}
  .hint{padding-bottom:6px}
  .msgactions{gap:6px}
  .smallbtn{min-height:34px}
}
@media (max-width:360px){
  header{gap:7px}
  .statusdot{padding:4px 8px;font-size:11px}
  #voiceLanguage{max-width:78px;font-size:12px}
  .iconbtn{width:36px;height:36px}
  .sendbtn{width:38px;height:38px}
}

/* rendered Markdown (assistant bubbles) */
.assistant .bubble p{margin:0 0 10px}
.assistant .bubble p:last-child{margin-bottom:0}
.assistant .bubble h1,
.assistant .bubble h2,
.assistant .bubble h3,
.assistant .bubble h4,
.assistant .bubble h5,
.assistant .bubble h6{
  margin:16px 0 8px;line-height:1.35;font-weight:700;color:var(--text);
  font-family:Fraunces,Georgia,serif;letter-spacing:-.01em;
}
.assistant .bubble h1{font-size:1.5em}
.assistant .bubble h2{font-size:1.3em}
.assistant .bubble h3{font-size:1.18em}
.assistant .bubble h4{font-size:1.08em}
.assistant .bubble h5{font-size:1em}
.assistant .bubble h6{font-size:.95em;color:var(--muted)}
.assistant .bubble ul,
.assistant .bubble ol{margin:8px 0 10px;padding-left:24px}
.assistant .bubble li{margin:3px 0}
.assistant .bubble li > ul,
.assistant .bubble li > ol{margin:4px 0}
.assistant .bubble .table-wrap{overflow-x:auto;max-width:100%;margin:12px 0;-webkit-overflow-scrolling:touch}
.assistant .bubble table{border-collapse:collapse;width:100%;margin:0;font-size:13.5px}
.assistant .bubble th,
.assistant .bubble td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.assistant .bubble th[align="center"],.assistant .bubble td[align="center"]{text-align:center}
.assistant .bubble th[align="right"],.assistant .bubble td[align="right"]{text-align:right}
.assistant .bubble th{background:var(--panel2);font-weight:600}
.assistant .bubble tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 40%,transparent)}
.assistant .bubble blockquote{
  border-left:3px solid var(--accent);margin:10px 0;padding:6px 14px;
  color:var(--muted);background:color-mix(in srgb,var(--panel2) 50%,transparent);
  border-radius:0 8px 8px 0;
}
.assistant .bubble hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.assistant .bubble a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.assistant .bubble a:hover{color:var(--accent2)}
.assistant .bubble pre{margin:10px 0}
.assistant .bubble img{max-width:100%;height:auto;border-radius:8px}
.assistant .bubble .katex-display{margin:10px 0;overflow-x:auto;overflow-y:hidden}
.assistant .bubble .math-fallback{white-space:pre-wrap}
.plain-fallback{white-space:pre-wrap;overflow-wrap:anywhere}
.md-heading{display:block;margin:16px 0 8px;font-size:1.15em;line-height:1.35;font-weight:700;color:var(--text)}

/* PDF export: progress overlay */
.pdf-overlay{position:fixed;inset:0;z-index:9999;background:var(--bg);display:grid;place-items:center}
.pdf-overlay-box{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--text);text-align:center;padding:20px}
.pdf-overlay-text{font-size:14px;color:var(--muted)}
.pdf-spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:pdfspin .8s linear infinite}
@keyframes pdfspin{to{transform:rotate(360deg)}}

/* PDF export: captured document (always light) */
.pdf-host{position:fixed;left:0;top:0;width:680px;background:#ffffff;z-index:1;pointer-events:none}
.pdf-doc{
  width:680px;background:#ffffff;color:#172033;
  font-family:"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Nirmala UI",Arial,sans-serif;
  font-size:14px;line-height:1.6;
}
.pdf-doc *{box-sizing:border-box}
.pdf-doc .pdf-title{font-size:22px;font-weight:700;color:#2b3a8f;margin:0 0 2px;line-height:1.3}
.pdf-doc .pdf-date{font-size:12px;color:#69748a;margin:0}
.pdf-doc .pdf-rule{border:0;border-top:2px solid #8b9cff;margin:10px 0 14px}
.pdf-doc p{margin:0 0 10px}
.pdf-doc h1,.pdf-doc h2,.pdf-doc h3,.pdf-doc h4,.pdf-doc h5,.pdf-doc h6{margin:18px 0 8px;line-height:1.3;font-weight:700;color:#111a2e}
.pdf-doc h1{font-size:21px}
.pdf-doc h2{font-size:18px}
.pdf-doc h3{font-size:16px}
.pdf-doc h4{font-size:15px}
.pdf-doc h5{font-size:14px}
.pdf-doc h6{font-size:13px;color:#56627a}
.pdf-doc strong,.pdf-doc b{font-weight:700}
.pdf-doc em,.pdf-doc i{font-style:italic}
.pdf-doc ul,.pdf-doc ol{margin:6px 0 10px;padding-left:26px}
.pdf-doc li{margin:3px 0}
.pdf-doc li > ul,.pdf-doc li > ol{margin:4px 0}
.pdf-doc blockquote{border-left:4px solid #8b9cff;margin:10px 0;padding:6px 14px;background:#f3f5fb;color:#3a4660}
.pdf-doc blockquote p:last-child{margin-bottom:0}
.pdf-doc hr{border:0;border-top:1px solid #cbd5e1;margin:14px 0}
.pdf-doc a{color:#3347a8;text-decoration:underline;overflow-wrap:break-word}
.pdf-doc code{background:#eef1f8;color:#33408f;padding:1px 4px;border-radius:4px;font-family:Consolas,"Courier New",monospace;font-size:12.5px;overflow-wrap:break-word}
.pdf-doc pre{background:#f3f5f9;color:#1b2333;border:1px solid #d5dbe7;border-radius:8px;padding:10px 12px;margin:10px 0;font-size:12px;line-height:1.5;white-space:pre-wrap;overflow-wrap:break-word;overflow:visible;max-width:none;font-family:Consolas,"Courier New",monospace}
.pdf-doc pre code{background:none;color:inherit;padding:0;font-size:12px}
.pdf-doc table{border-collapse:separate;border-spacing:0;width:100%;margin:12px 0;font-size:12.5px}

<!-- Markdown parser + HTML sanitizer + equations + PDF libraries (pinned versions) -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script>
/* ============================================================
   BACKEND CONTRACT — DO NOT CHANGE WITHOUT UPDATING server.js
   POST /api/chat         { messages:[{role,content}], attachment, mode }
   POST /api/transcribe   { audio, mimeType, language }
   GET  /health
   The study focus lives on the server via SYSTEM_PROMPT, so the
   UI no longer exposes a mode selector. We still include `mode`
   in the payload (set to "study") so that if server.js requires
   a mode field, it stays satisfied — and it is a harmless no-op
   if the server ignores it.
   ============================================================ */
const API_URL = "https://rashai.onrender.com/api/chat";
const TRANSCRIBE_URL = "https://rashai.onrender.com/api/transcribe";
const HEALTH_URL = "https://rashai.onrender.com/health";
const STUDY_MODE = "study";
const $ = id => document.getElementById(id);

const escapeHTML = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));

/* =====================================================================
   MARKDOWN PIPELINE (shared by the chat view and the PDF export)
   ===================================================================== */
const SAFE_INLINE_HTML = /^<\/?(?:br|sub|sup|b|i|u|s|strong|em|mark|small|kbd|del|ins)\s*\/?>$/i;

if (window.marked) {
  marked.use({
    gfm: true,
    breaks: true,
    renderer: {
      html(html, block) {
        if (html && typeof html === "object") { block = html.block; html = html.text; }
        const raw = String(html ?? "");
        const t = raw.trim();
        if (SAFE_INLINE_HTML.test(t)) return t;
        const esc = escapeHTML(raw);
        return block ? "<pre><code>" + esc.replace(/\n+$/, "") + "</code></pre>" : esc;
      },
      image(href, title, text) {
        if (href && typeof href === "object") { text = href.text; href = href.href; }
        const label = escapeHTML(text || href || "image");
        return '<a href="' + escapeHTML(href || "") + '" target="_blank" rel="noopener noreferrer">Image: ' + label + "</a>";
      },
      checkbox(checked) {
        if (checked && typeof checked === "object") checked = checked.checked;
        return checked ? "☑ " : "☐ ";
      }
    }
  });
}

if (window.DOMPurify) {
  DOMPurify.addHook("afterSanitizeAttributes", node => {
    if (node.tagName === "A") {
      const href = node.getAttribute("href") || "";
      if (href && href.charAt(0) !== "#") {
        node.setAttribute("target", "_blank");
        node.setAttribute("rel", "noopener noreferrer");
      }
    }
  });
}

const PURIFY_CONFIG = {
  FORBID_TAGS: ["style","form","input","button","textarea","select","option","iframe","object","embed","link","meta","base","img","svg","math"],
  FORBID_ATTR: ["style", "srcset"],
  ALLOW_DATA_ATTR: false
};

function extractInlineDollar(s, add) {
  let out = "", i = 0;
  const n = s.length;
  while (i < n) {
    const c = s[i];
    if (c === "\\") { out += s.slice(i, i + 2); i += 2; continue; }
    if (c === "$") {
      const prev = i > 0 ? s[i - 1] : "";
      const next = i + 1 < n ? s[i + 1] : "";
      if (next && next !== "$" && !/\s/.test(next) && !/\w/.test(prev)) {
        let j = i + 1, found = -1;
        while (j < n) {
          const d = s[j];
          if (d === "\\") { j += 2; continue; }
          if (d === "\n") break;
          if (d === "$") { found = j; break; }
          j++;
        }
        if (found > i + 1) {
          const tex = s.slice(i + 1, found);
          const after = found + 1 < n ? s[found + 1] : "";
          if (!/\s$/.test(tex) && !/[0-9]/.test(after)) {
            out += add(tex);
            i = found + 1;
            continue;
          }
        }
      }
    }
    out += c;
    i++;
  }
  return out;
}

function cleanProse(s) {
  s = s.replace(/\\{2,}(?=[*_#|~>\-])/g, "\\");
  s = s.split("\n").map(line => {
    if (/^[ \t|:\\-]*$/.test(line) && /-{3,}/.test(line.replace(/\\/g, ""))) return line.replace(/\\/g, "");
    if (/^[ \t]*(?:\\?[*_]){3,}[ \t]*$/.test(line)) return line.replace(/\\/g, "");
    return line;
  }).join("\n");
  s = s.replace(/^([ \t]*)\\(#{1,6}[ \t])/gm, "$1$2");
  s = s.replace(/^([ \t]*)\\([*+-])(?=[ \t])/gm, "$1$2");
  s = s.replace(/^([ \t]*\d{1,3})\\\.(?=[ \t])/gm, "$1.");
  s = s.replace(/^([ \t]*#{2,6})(?=[^\s#])/gm, "$1 ");
  s = s.replace(/^([ \t]*)[•●▪◦‣∙][ \t]+/gm, "$1- ");
  s = s.replace(/\\\*\\\*\\\*/g, "***").replace(/\\\*\\\*/g, "**").replace(/\\_\\_/g, "__");
  s = s.replace(/\\\*([^\n*\\]+?)\\\*/g, "*$1*");
  const delim = l => l.indexOf("|") !== -1 && /^[ \t]*\|?[ \t]*:?-+:?[ \t]*(?:\|[ \t]*:?-+:?[ \t]*)*\|?[ \t]*$/.test(l);
  const lines = s.split("\n"), out = [];
  for (const line of lines) {
    if (out.length >= 2 && delim(line)) {
      const header = out[out.length - 1], above = out[out.length - 2];
      if (header.indexOf("|") !== -1 && !delim(header) && above.trim() !== "" && above.indexOf("|") === -1) {
        out.splice(out.length - 1, 0, "");
      }
    }
    out.push(line);
  }
  return out.join("\n");
}

function processProse(t, addMath) {
  const stash = [];
  const unstash = x => x.replace(/\uE000(\d+)\uE001/g, (m, i) => stash[+i]);
  let s = t.replace(/(`+)(?:[^`]|[^`][\s\S]*?[^`])\1(?!`)/g, m => {
    stash.push(m);
    return "\uE000" + (stash.length - 1) + "\uE001";
  });
  s = s.replace(/\$\$([\s\S]+?)\$\$/g, (m, x) => addMath(unstash(x), true));
  s = s.replace(/\\\[([\s\S]+?)\\\]/g, (m, x) => /[\\^_={]/.test(x) ? addMath(unstash(x), true) : m);
  s = s.replace(/\\\(([\s\S]+?)\\\)/g, (m, x) => addMath(unstash(x), false));
  s = extractInlineDollar(s, x => addMath(unstash(x), false));
  s = cleanProse(s);
  return unstash(s);
}

function preprocessMarkdown(src, tok) {
  const maths = [];
  const lines = String(src ?? "").replace(/\r\n?/g, "\n").split("\n");
  const segs = [];
  let buf = [], inFence = false, fenceCh = "", fenceLen = 0;
  const flush = code => { if (buf.length) { segs.push({ code, text: buf.join("\n") }); buf = []; } };
  for (const line of lines) {
    if (!inFence) {
      const m = line.match(/^[ \t]*(`{3,})[^`]*$/) || line.match(/^[ \t]*(~{3,})/);
      if (m) { flush(false); inFence = true; fenceCh = m[1][0]; fenceLen = m[1].length; }
      buf.push(line);
    } else {
      buf.push(line);
      const m = line.match(/^[ \t]*(`{3,}|~{3,})[ \t]*$/);
      if (m && m[1][0] === fenceCh && m[1].length >= fenceLen) { flush(true); inFence = false; }
    }
  }
  flush(inFence);
  const addMath = (tex, display) => {
    maths.push({ tex: tex.trim(), display });
    return tok + (maths.length - 1) + "END";
  };
  const text = segs.map(sg => sg.code ? sg.text : processProse(sg.text, addMath)).join("\n");
  return { text, maths };
}

function mathToHtml(m) {
  if (window.katex) {
    try {
      return katex.renderToString(m.tex, {
        displayMode: m.display, throwOnError: false, output: "html",
        strict: "ignore", trust: false
      });
    } catch (e) {}
  }
  const c = escapeHTML(m.tex);
  return m.display ? '<pre class="math-fallback">' + c + "</pre>" : '<code class="math-fallback">' + c + "</code>";
}

function renderMarkdown(src, opts) {
  const wrapTables = !!(opts && opts.wrapTables);
  const text = String(src ?? "");
  const fallback = '<div class="plain-fallback">' + escapeHTML(text) + "</div>";
  if (!window.marked || !window.DOMPurify) return fallback;
  try {
    const nonce = Math.random().toString(36).slice(2, 8) || "x";
    const tok = "RASHMATH" + nonce + "N";
    const pre = preprocessMarkdown(text, tok);
    let html = DOMPurify.sanitize(marked.parse(pre.text), PURIFY_CONFIG);
    if (pre.maths.length) {
      const re = new RegExp(tok + "(\\d+)END", "g");
      html = html.replace(re, (m, i) => {
        const mm = pre.maths[+i];
        return mm ? mathToHtml(mm) : m;
      });
    }
    if (wrapTables) {
      html = html.replace(/<table(?=[\s>])/g, '<div class="table-wrap"><table').replace(/<\/table>/g, "</table></div>");
    }
    return html;
  } catch (err) {
    console.error("Markdown rendering failed:", err);
    return fallback;
  }
}

const renderCache = new Map();
function formatAnswer(t) {
  const key = String(t ?? "");
  if (!key) return "";
  if (renderCache.has(key)) return renderCache.get(key);
  const html = renderMarkdown(key, { wrapTables: true });
  if (renderCache.size > 150) renderCache.delete(renderCache.keys().next().value);
  renderCache.set(key, html);
  return html;
}

function plainText(md) {
  return String(md ?? "")
    .replace(/```[^\n]*\n?([\s\S]*?)```/g, "$1")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/!\[([^\]]*)\]\([^)]*\)/g, "$1")
    .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
    .replace(/^[ \t]{0,3}#{1,6}[ \t]+/gm, "")
    .replace(/^[ \t]*>[ \t]?/gm, "")
    .replace(/^[ \t]*[-*+][ \t]+/gm, "")
    .replace(/^[ \t]*\|?[ \t:|-]+\|?[ \t]*$/gm, "")
    .replace(/\|/g, ", ")
    .replace(/(\*\*|__|\*|~~)/g, "")
    .replace(/\\([^\w\s])/g, "$1")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

/* =====================================================================
   APP STATE
   ===================================================================== */
let history = [], attachment = null, busy = false, currentChatId = null;
let savedChats = [];
try { savedChats = JSON.parse(localStorage.getItem("rashai") || "[]"); } catch { savedChats = []; }

/* ---------- wake the free Render backend ---------- */
async function wakeServer() {
  try {
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), 8000);
    await fetch(HEALTH_URL, { cache: "no-store", signal: controller.signal });
    clearTimeout(t);
  } catch (e) {
    console.warn("Wake-up ping failed (server may still be starting):", e.message);
  }
}

/* ---------- sidebar and chats ---------- */
function openSidebar() { $("side").classList.add("open"); $("overlay").classList.add("show"); }
function closeSidebar() { $("side").classList.remove("open"); $("overlay").classList.remove("show"); }
$("menu").onclick = openSidebar; $("closeSide").onclick = closeSidebar; $("overlay").onclick = closeSidebar;

function persist() { try { localStorage.setItem("rashai", JSON.stringify(savedChats)); } catch {} }

function renderRecent() {
  $("recent").innerHTML = "";
  savedChats.slice().reverse().forEach(chat => {
    const b = document.createElement("button");
    b.className = "recentitem" + (chat.id === currentChatId ? " active" : "");
    b.textContent = chat.title || "Session";
    b.onclick = () => {
      saveCurrentChat();
      history = chat.messages || [];
      currentChatId = chat.id;
      renderMessages();
      renderRecent();
      closeSidebar();
    };
    $("recent").appendChild(b);
  });
}

function saveCurrentChat() {
  if (!history.length) return;
  const title = (history.find(m => m.role === "user")?.content || "New session").slice(0, 42);
  if (!currentChatId) currentChatId = String(Date.now());
  const entry = { id: currentChatId, title, messages: history, updated: Date.now() };
  const i = savedChats.findIndex(c => c.id === currentChatId);
  if (i >= 0) savedChats[i] = entry; else savedChats.push(entry);
  savedChats = savedChats.slice(-30);
  persist();
  renderRecent();
}

function newChat() {
  saveCurrentChat();
  history = []; currentChatId = null; attachment = null;
  updateFileChip(); renderMessages(); renderRecent();
  $("prompt").value = "";
  closeSidebar();
  $("prompt").focus();
}
$("newChat").onclick = newChat;
$("clearChats").onclick = () => {
  if (confirm("Clear all saved chat history?")) {
    savedChats = []; currentChatId = null; persist(); renderRecent();
  }
};

$("themeBtn").onclick = () => {
  document.body.classList.toggle("light");
  localStorage.setItem("rashai-theme", document.body.classList.contains("light") ? "light" : "dark");
};
if (localStorage.getItem("rashai-theme") === "light") document.body.classList.add("light");

/* suggestions */
document.querySelectorAll(".suggestions button").forEach(b => {
  b.onclick = () => { $("prompt").value = b.dataset.prompt; $("prompt").dispatchEvent(new Event("input")); $("prompt").focus(); };
});

/* ---------- message actions ---------- */
function action(label, fn) {
  const b = document.createElement("button");
  b.className = "smallbtn";
  b.textContent = label;
  b.onclick = () => fn(b);
  return b;
}

async function copyText(text, btn) {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch {
    const t = document.createElement("textarea");
    t.value = text;
    t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    try { ok = document.execCommand("copy"); } catch {}
    t.remove();
  }
  if (btn) {
    const old = btn.textContent;
    btn.textContent = ok ? "Copied ✓" : "Copy failed";
    setTimeout(() => { btn.textContent = old; }, 1500);
  }
}

function renderMessages() {
  const wrap = $("wrap");
  wrap.innerHTML = "";
  document.body.classList.toggle("empty", history.length === 0);
  $("hello").style.display = history.length ? "none" : "block";

  history.forEach(m => {
    const row = document.createElement("div");
    row.className = "msgrow " + (m.role === "user" ? "user" : "assistant");
    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (m.role === "assistant") bubble.innerHTML = formatAnswer(m.content || "");
    else bubble.textContent = m.content || "";

    row.appendChild(bubble);

    if (m.role === "assistant") {
      const a = document.createElement("div");
      a.className = "msgactions";
      a.append(
        action("Copy", btn => copyText(m.content || "", btn)),
        action("Read aloud", () => speak(m.content || "")),
        action("Download TXT", () => downloadText(m.content || "", "rashai-answer.txt")),
        action("Download PDF", btn => downloadPDF(m.content || "", btn))
      );
      bubble.appendChild(a);
    }

    wrap.appendChild(row);
  });

  $("msgs").scrollTop = $("msgs").scrollHeight;
}

/* ---------- attachments ---------- */
$("attach").onclick = () => $("file").click();

$("file").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;

  if (f.size > 5 * 1024 * 1024) {
    alert("Files must be 5 MB or smaller.");
    e.target.value = "";
    return;
  }

  try {
    const data = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(new Error("Could not read the file."));
      r.readAsDataURL(f);
    });
    attachment = { name: f.name, type: f.type || "application/octet-stream", data };
    updateFileChip();
  } catch (err) {
    alert(err.message);
    e.target.value = "";
  }
};

function updateFileChip() {
  $("filechip").style.display = attachment ? "block" : "none";
  $("filechip").textContent = attachment ? `📎 ${attachment.name}  ×` : "";
  $("filechip").onclick = () => { attachment = null; $("file").value = ""; updateFileChip(); };
}

/* ---------- sending ---------- */
async function send() {
  const text = $("prompt").value.trim();
  if ((!text && !attachment) || busy) return;

  const msg = (text || "Please review the attached file.") + (attachment ? `\n[Attachment: ${attachment.name}]` : "");
  history.push({ role: "user", content: msg });
  renderMessages();
  $("prompt").value = "";
  $("prompt").style.height = "40px";
  busy = true;
  $("send").disabled = true;

  const loading = document.createElement("div");
  loading.className = "typing";
  loading.innerHTML = "<i></i><i></i><i></i> RashAI is thinking…";
  $("wrap").appendChild(loading);
  $("msgs").scrollTop = $("msgs").scrollHeight;

  try {
    await wakeServer();

    const r = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: history.filter(m => !m.error).map(m => ({ role: m.role, content: m.content })),
        attachment,
        mode: STUDY_MODE
      })
    });

    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Server returned " + r.status);

    history.push({
      role: "assistant",
      content: d.text || d.reply || d.response || d.message || d.answer || "I couldn't find a response. Please try again."
    });
    renderMessages();
    saveCurrentChat();
  } catch (e) {
    const offline = e instanceof TypeError;
    history.push({
      role: "assistant",
      error: true,
      content: offline
        ? "Sorry, I couldn't reach RashAI. The free server may be waking up — wait about a minute and try again."
        : "Sorry, something went wrong.\n\n" + e.message
    });
    renderMessages();
  } finally {
    attachment = null;
    $("file").value = "";
    updateFileChip();
    busy = false;
    $("send").disabled = false;
    $("prompt").focus();
  }
}

$("send").onclick = send;
$("prompt").addEventListener("input", () => {
  $("prompt").style.height = "40px";
  $("prompt").style.height = Math.min($("prompt").scrollHeight, 160) + "px";
});
$("prompt").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

/* ---------- read aloud, TXT ---------- */
function speak(t) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(plainText(t)));
}

function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.rel = "noopener";
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 60000);
}

function downloadText(t, n) {
  saveBlob(new Blob([t], { type: "text/plain;charset=utf-8" }), n);
}

/* =====================================================================
   PDF EXPORT
   ===================================================================== */
const PDF_CFG = { pageW: 210, pageH: 297, marginX: 15, marginTop: 16, marginBottom: 20, docPx: 680, scale: 2 };
let pdfBusy = false;

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Failed to load " + src));
    document.head.appendChild(s);
  });
}

async function ensureLib(isReady, urls) {
  if (isReady()) return;
  for (const u of urls) {
    try { await loadScript(u); } catch (e) { continue; }
    if (isReady()) return;
  }
  throw new Error("A PDF library could not be loaded. Check your internet connection and try again.");
}

async function ensurePdfLibs() {
  await ensureLib(() => typeof window.html2canvas === "function",
    ["https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"]);
  await ensureLib(() => !!(window.jspdf && window.jspdf.jsPDF),
    ["https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"]);
}

function showPdfOverlay(msg) {
  const o = document.createElement("div");
  o.className = "pdf-overlay";
  o.innerHTML = '<div class="pdf-overlay-box"><div class="pdf-spinner"></div><div class="pdf-overlay-text"></div></div>';
  o.querySelector(".pdf-overlay-text").textContent = msg;
  document.body.appendChild(o);
  return o;
}

function setPdfOverlay(o, msg) {
  const t = o && o.querySelector(".pdf-overlay-text");
  if (t) t.textContent = msg;
}

async function waitForFonts() {
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch {}
  await new Promise(r => setTimeout(r, 250));
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch {}
}

function paginateDoc(doc, pageH) {
  const rootTop = doc.getBoundingClientRect().top;
  const rel = el => {
    const r = el.getBoundingClientRect();
    return { top: r.top - rootTop, bottom: r.bottom - rootTop };
  };
  const atoms = [];
  const heads = new Map();

  const push = (el, top, bottom, extra) => {
    if (bottom - top < 0.5) return;
    const cs = getComputedStyle(el);
    let lh = parseFloat(cs.lineHeight);
    if (!isFinite(lh) || lh <= 0) lh = (parseFloat(cs.fontSize) || 14) * 1.4;
    const pt = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.borderTopWidth) || 0);
    atoms.push(Object.assign({ top, bottom, lh, ft: top + pt }, extra || {}));
  };

  const walk = el => {
    const tag = el.tagName;
    const r = rel(el);

    if (tag === "TABLE") {
      const thead = el.tHead;
      if (thead) {
        const hr = rel(thead);
        heads.set(el, { top: hr.top, bottom: hr.bottom });
      }
      Array.from(el.rows).forEach(row => {
        const rr = rel(row);
        const inHead = !!thead && thead.contains(row);
        push(row, rr.top, rr.bottom, { row: true, table: el, head: inHead, keep: inHead, lh: 0 });
      });
      return;
    }

    if (tag === "UL" || tag === "OL") {
      Array.from(el.children).forEach(li => {
        const q = rel(li);
        if (li.tagName !== "LI") { push(li, q.top, q.bottom); return; }
        const nested = Array.from(li.children).find(c => c.tagName === "UL" || c.tagName === "OL");
        if (nested && (q.bottom - q.top) > pageH * 0.35) {
          const nq = rel(nested);
          push(li, q.top, nq.top);
          walk(nested);
        } else {
          push(li, q.top, q.bottom);
        }
      });
      return;
    }

    if (tag === "BLOCKQUOTE" && (r.bottom - r.top) > pageH * 0.5) {
      Array.from(el.children).forEach(walk);
      return;
    }

    const isHeading = /^H[1-6]$/.test(tag);
    push(el, r.top, r.bottom, { keep: isHeading });
  };

  Array.from(doc.children).forEach(walk);

  const total = Math.ceil(doc.getBoundingClientRect().height);
  const pages = [];
  let cur = { start: 0, head: null, cap: pageH };

  for (let i = 0; i < atoms.length; i++) {
    const a = atoms[i];
    let need = a.bottom;
    if (a.keep && atoms[i + 1]) {
      const n = atoms[i + 1];
      need = Math.max(need, Math.min(n.bottom, n.top + 80));
    }
    const hasContent = a.top - cur.start > 2;

    if (need - cur.start > cur.cap && hasContent) {
      const s = Math.round(a.top);
      pages.push({ start: cur.start, end: Math.min(s, cur.start + cur.cap), head: cur.head });
      const hd = (a.row && !a.head) ? heads.get(a.table) : null;
      let head = null;
      if (hd) {
        const ht = Math.round(hd.top);
        head = { top: ht, h: Math.round(hd.bottom) - ht };
      }
      cur = { start: s, head, cap: pageH - (head ? head.h : 0) };
    }

    while (a.bottom - cur.start > cur.cap + 0.5) {
      let limit = cur.start + cur.cap;
      if (a.lh > 4) {
        const b = a.ft + Math.floor((limit - a.ft) / a.lh) * a.lh;
        if (b > cur.start + a.lh) limit = b;
      }
      limit = Math.round(limit);
      if (limit <= cur.start) limit = cur.start + Math.max(1, Math.floor(cur.cap));
      pages.push({ start: cur.start, end: limit, head: cur.head });
      cur = { start: limit, head: null, cap: pageH };
    }
  }

  while (total - cur.start > cur.cap + 1) {
    const end = cur.start + Math.max(1, Math.floor(cur.cap));
    pages.push({ start: cur.start, end, head: cur.head });
    cur = { start: end, head: null, cap: pageH };
  }
  pages.push({ start: cur.start, end: total, head: cur.head });

  return { pages: pages.filter(p => p.end - p.start >= 2), total };
}

async function downloadPDF(text, btn) {
  const answer = String(text ?? "").trim();
  if (!answer) { alert("No answer text was found."); return; }
  if (pdfBusy) return;
  pdfBusy = true;

  const C = PDF_CFG;
  const oldLabel = btn ? btn.textContent : "";
  if (btn) { btn.textContent = "Creating PDF…"; btn.disabled = true; }

  let overlay = null, host = null;
  try {
    overlay = showPdfOverlay("Preparing PDF…");
    await ensurePdfLibs();

    host = document.createElement("div");
    host.id = "pdfHost";
    host.className = "pdf-host";
    const doc = document.createElement("div");
    doc.className = "pdf-doc";
    const dateStr = new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
    doc.innerHTML =
      '<div class="pdf-title">RashAI — Study Answer</div>' +
      '<div class="pdf-date">' + escapeHTML(dateStr) + "</div>" +
      '<hr class="pdf-rule">' +
      renderMarkdown(answer);
    host.appendChild(doc);
    document.body.appendChild(host);
    void host.offsetHeight;
    await waitForFonts();

    const contentWmm = C.pageW - 2 * C.marginX;
    const pxPerMm = C.docPx / contentWmm;
    const pageH = Math.floor((C.pageH - C.marginTop - C.marginBottom) * pxPerMm);

    const { pages, total } = paginateDoc(doc, pageH);
    if (!pages.length) throw new Error("There is nothing to export.");

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait", compress: true });
    pdf.setProperties({ title: "RashAI Study Answer", creator: "RashAI" });

    const baseOpts = {
      scale: C.scale,
      backgroundColor: "#ffffff",
      logging: false,
      useCORS: false,
      allowTaint: false,
      scrollX: 0, scrollY: 0,
      windowWidth: Math.max(C.docPx, window.innerWidth),
      windowHeight: Math.max(window.innerHeight, total + 50),
      onclone: cd => {
        Array.from(cd.body.children).forEach(ch => { if (ch.id !== "pdfHost") ch.remove(); });
      }
    };
    const grab = (y, h) => html2canvas(doc, Object.assign({}, baseOpts, { x: 0, y, width: C.docPx, height: h }));

    for (let p = 0; p < pages.length; p++) {
      const pg = pages[p];
      setPdfOverlay(overlay, "Creating PDF… page " + (p + 1) + " of " + pages.length);
      await new Promise(r => setTimeout(r, 0));

      let canvas = await grab(pg.start, pg.end - pg.start);

      if (pg.head && pg.head.h > 0) {
        const hc = await grab(pg.head.top, pg.head.h);
        const comp = document.createElement("canvas");
        comp.width = canvas.width;
        comp.height = hc.height + canvas.height;
        const ctx = comp.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, comp.width, comp.height);
        ctx.drawImage(hc, 0, 0);
        ctx.drawImage(canvas, 0, hc.height);
        canvas = comp;
      }

      if (p > 0) pdf.addPage();
      const imgData = canvas.toDataURL("image/jpeg", 0.92);
      const hMm = (canvas.height / C.scale) / pxPerMm;
      pdf.addImage(imgData, "JPEG", C.marginX, C.marginTop, contentWmm, hMm, undefined, "FAST");
      canvas.width = 0; canvas.height = 0;
    }

    const n = pdf.getNumberOfPages();
    for (let i = 1; i <= n; i++) {
      pdf.setPage(i);
      pdf.setFont("helvetica", "normal");
      pdf.setFontSize(8);
      pdf.setTextColor(120, 130, 150);
      pdf.text("RashAI", C.marginX, C.pageH - 9);
      pdf.text("Page " + i + " of " + n, C.pageW - C.marginX, C.pageH - 9, { align: "right" });
    }

    setPdfOverlay(overlay, "Saving PDF…");
    const d = new Date();
    const p2 = v => String(v).padStart(2, "0");
    const stamp = d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + "-" + p2(d.getHours()) + p2(d.getMinutes());
    saveBlob(pdf.output("blob"), "rashai-study-answer-" + stamp + ".pdf");
  } catch (err) {
    console.error("PDF export failed:", err);
    alert("Could not create the PDF.\n" + (err && err.message ? err.message : "Please try again."));
  } finally {
    if (host) host.remove();
    if (overlay) overlay.remove();
    if (btn) { btn.textContent = oldLabel || "Download PDF"; btn.disabled = false; }
    pdfBusy = false;
  }
}

/* ---------- voice input ---------- */
let mediaRecorder = null, audioChunks = [], recordingStream = null;
let recordingTimer = null, isRecording = false;

const savedVoiceLang = localStorage.getItem("rashai-voice-lang");
if (savedVoiceLang && [...$("voiceLanguage").options].some(o => o.value === savedVoiceLang)) {
  $("voiceLanguage").value = savedVoiceLang;
}
$("voiceLanguage").onchange = () => localStorage.setItem("rashai-voice-lang", $("voiceLanguage").value);

function pickAudioMime() {
  const options = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
  return options.find(t => MediaRecorder.isTypeSupported(t)) || "";
}

function resetMic() {
  clearTimeout(recordingTimer);
  if (recordingStream) recordingStream.getTracks().forEach(t => t.stop());
  recordingStream = null;
  isRecording = false;
  $("mic").disabled = false;
  $("mic").classList.remove("recording");
  $("mic").textContent = "🎙";
  $("mic").title = "Start voice recording";
}

$("mic").onclick = async () => {
  if (isRecording) { mediaRecorder?.stop(); return; }

  await wakeServer();

  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
    alert("Voice recording is not supported in this browser.");
    return;
  }

  try {
    recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    const mimeType = pickAudioMime();
    mediaRecorder = new MediaRecorder(recordingStream, mimeType ? { mimeType } : undefined);

    mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) audioChunks.push(e.data); };

    mediaRecorder.onstop = async () => {
      const type = mediaRecorder.mimeType || mimeType || "audio/webm";
      const blob = new Blob(audioChunks, { type });
      resetMic();

      if (!blob.size) { alert("No audio was recorded. Please try again."); return; }
      if (blob.size > 5 * 1024 * 1024) { alert("Recording is too large. Please record a shorter message."); return; }

      $("mic").disabled = true;
      $("mic").textContent = "…";

      try {
        const dataUrl = await new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => resolve(r.result);
          r.onerror = () => reject(new Error("Could not read the recording."));
          r.readAsDataURL(blob);
        });

        const response = await fetch(TRANSCRIBE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            audio: String(dataUrl).split(",")[1],
            mimeType: type,
            language: $("voiceLanguage").value
          })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error || `Transcription failed (HTTP ${response.status}).`);
        }

        const text = (data.text || "").trim();
        if (!text) throw new Error("No speech was detected. Please try again.");

        $("prompt").value += ($("prompt").value.trim() ? " " : "") + text;
        $("prompt").dispatchEvent(new Event("input"));
        $("prompt").focus();
      } catch (error) {
        console.error("Transcription error:", error);
        if (error instanceof TypeError) {
          alert("Could not reach the server. It may be waking up — wait about a minute and try again.");
        } else {
          alert(error.message || "Voice transcription failed. Please try again.");
        }
      } finally {
        $("mic").disabled = false;
        $("mic").textContent = "🎙";
      }
    };

    mediaRecorder.onerror = () => { resetMic(); alert("Recording failed. Please try again."); };

    mediaRecorder.start();
    isRecording = true;
    $("mic").textContent = "⏹";
    $("mic").classList.add("recording");
    $("mic").title = "Stop recording";
    recordingTimer = setTimeout(() => {
      if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
    }, 60000);
  } catch (error) {
    resetMic();
    alert(error.name === "NotAllowedError"
      ? "Please allow microphone access in your browser."
      : "Could not start recording. Check your microphone and try again.");
  }
};

renderRecent();
renderMessages();
